  <title>Talent Book | Product presentation</title>
  <!-- Vite's development HTML fallback looks in the project root, not public/.
       This additive entry directs /presentacion to the static deck. Production
       hosts serve public/presentacion/index.html directly after the normal build. -->
  <script>
    const directory = location.pathname.replace(/\/presentacion(?:\/|\/index\.html)?$/, '/presentacion/');
    location.replace(directory + 'index.html' + location.search + location.hash);
  </script>
</head>
